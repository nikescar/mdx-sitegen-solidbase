name: Test website build

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Build site (no deploy)
        run: |
          export theme_upstream=$(grep -m1 'theme_upstream:' _config.yml | awk '{print $2}' | sed "s/'//g")/archive/refs/heads/main.tar.gz
          wget -q "$theme_upstream" -O main.tar.gz
          if [ $? -ne 0 ]; then
              echo "Failed to download theme from $theme_upstream"
              exit 1
          fi
          mkdir -p .solidbase
          tar -xzf main.tar.gz --strip-components=1 -C .solidbase
          pushd ./.solidbase
          bash ghworkflow.sh --no-deploy --src-path ../
          popd

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-output
          path: .solidbase/.output/public
          retention-days: 7
